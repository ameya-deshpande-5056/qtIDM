name: Update linuxdeploy Hashes

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-hashes:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run hash update script
        id: update
        run: bash packaging/release/update-linuxdeploy-hashes.sh

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(ci): update packaging dependencies and continuous checksums'
          title: 'chore(ci): update packaging dependencies and continuous checksums'
          body: |
            Automated update of Flatpak packaging dependencies (`yt-dlp`, `7zip`, `libsecret`) and continuous `linuxdeploy` / `linuxdeploy-plugin-qt` SHA-256 checksums.

            - **linuxdeploy**: `${{ steps.update.outputs.linuxdeploy_sha }}`
            - **linuxdeploy-plugin-qt**: `${{ steps.update.outputs.plugin_sha }}`

            Triggered by scheduled packaging dependency verification workflow.
          branch: ci/update-packaging-dependencies
          delete-branch: true
          labels: |
            ci
            dependencies

