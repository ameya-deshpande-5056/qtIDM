name: Build Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      sign_extensions:
        description: Build Chrome ZIP/CRX and signed Firefox XPI packages
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DEV_CHROME_EXTENSION_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      QTIDM_CHROME_EXTENSION_ID: ${{ vars.QTIDM_CHROME_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Synchronize version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh packaging/release/sync-tag-version.sh --apply "$GITHUB_REF_NAME"

      - name: Set up Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Set up Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - uses: actions/setup-node@v6
        with:
          # Resolve the current active LTS at workflow runtime so the browser
          # packaging and E2E tooling do not remain on a deprecated line.
          node-version: lts/*

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-pip pipx xvfb dbus-x11 qt6-base-dev qt6-base-dev-tools libcurl4-openssl-dev libsqlite3-dev pkg-config debhelper devscripts appstream desktop-file-utils flatpak flatpak-builder libfuse2 ffmpeg 7zip zip unzip openssl libsecret-tools
          python3 -m pip install --upgrade --break-system-packages yt-dlp || pipx install yt-dlp
          PUPPETEER_SKIP_DOWNLOAD=true npm install --global puppeteer web-ext

      - name: Build development browser packages
        run: sh packaging/browser/build-extensions.sh --mode development --output build/browser-packages

      - name: Validate browser release signing configuration
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign_extensions)
        env:
          QTIDM_CHROME_EXTENSION_KEY_B64: ${{ secrets.QTIDM_CHROME_EXTENSION_KEY_B64 }}
          FIREFOX_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [ -z "${QTIDM_CHROME_EXTENSION_ID:-}" ] || [ "${QTIDM_CHROME_EXTENSION_ID}" = "${DEV_CHROME_EXTENSION_ID}" ]; then
            echo "Set repository variable QTIDM_CHROME_EXTENSION_ID to the ID derived from the release signing key." >&2
            exit 1
          fi
          if [ -z "${QTIDM_CHROME_EXTENSION_KEY_B64:-}" ] || [ -z "${FIREFOX_API_KEY:-}" ] || [ -z "${FIREFOX_API_SECRET:-}" ]; then
            echo "Signed extension builds require the Chrome key and AMO API repository secrets." >&2
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/qtidm-chrome-extension.pem"
          umask 077
          printf '%s' "$QTIDM_CHROME_EXTENSION_KEY_B64" | base64 --decode > "$KEY_FILE"
          DERIVED_ID="$(sh packaging/browser/chrome-extension-id.sh "$KEY_FILE")"
          if [ "$DERIVED_ID" != "$QTIDM_CHROME_EXTENSION_ID" ]; then
            echo "Chrome key produces extension ID $DERIVED_ID, not $QTIDM_CHROME_EXTENSION_ID." >&2
            exit 1
          fi
          echo "QTIDM_CHROME_EXTENSION_KEY=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          CHROME_ID="${QTIDM_CHROME_EXTENSION_ID:-$DEV_CHROME_EXTENSION_ID}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQTIDM_CHROME_EXTENSION_ID="$CHROME_ID"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -E 'extension_e2e' --output-on-failure

      - name: Validate packaging metadata
        run: |
          sh -n packaging/build-deb.sh packaging/build-appimage.sh packaging/build-flatpak.sh packaging/browser/ci-extension-version.sh packaging/release/build-flatpak-bundle.sh packaging/release/sync-tag-version.sh packaging/appimage/AppRun packaging/build-rpm.sh packaging/build-arch.sh
          sh packaging/browser/ci-extension-version.sh 1 1 >/dev/null
          VERSION="$(sh packaging/release/version-info.sh)"
          sh packaging/release/sync-tag-version.sh "v$VERSION" >/dev/null
          desktop-file-validate assets/io.qtidm.Qtidm.desktop
          appstreamcli validate --pedantic --no-net assets/io.qtidm.Qtidm.appdata.xml
          flatpak-builder --show-manifest packaging/flatpak/io.qtidm.Qtidm.yml >/dev/null

      - name: Browser extension end-to-end
        env:
          QTIDM_BROWSER_E2E_STRICT: 1
          QTIDM_E2E_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          QTIDM_E2E_CHROME_NO_SANDBOX: 1
          QTIDM_E2E_FIREFOX: ${{ steps.setup-firefox.outputs.firefox-path }}
        run: |
          ctest --test-dir build -R '^qtIDM_(chrome|firefox)_extension_e2e_tests$' --output-on-failure --no-tests=error

      - name: Performance smoke
        if: github.event_name == 'schedule'
        env:
          QTIDM_RUN_PERF_TESTS: 1
        run: ctest --test-dir build -R qtIDM_performance_smoke_tests --output-on-failure

      - name: Prepare release metadata
        id: version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="$(sh packaging/release/version-info.sh)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" != "v$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMake version v$VERSION" >&2
            exit 1
          fi
          sh packaging/release/extract-changelog.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Auto-increment browser extension version
        id: extension-version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign_extensions)
        run: |
          VERSION="$(sh packaging/browser/ci-extension-version.sh --apply "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Signing browser extensions as version $VERSION"

      - name: Build signed browser packages
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign_extensions)
        env:
          QTIDM_CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          sh packaging/browser/build-extensions.sh --mode release --output browser/packages
          mkdir -p dist
          cp browser/packages/qtidm-chrome.zip "dist/qtIDM-browser-chrome-${{ steps.version.outputs.version }}.zip"
          cp browser/packages/qtidm-chrome.crx "dist/qtIDM-browser-chromium-${{ steps.version.outputs.version }}.crx"
          cp browser/packages/qtidm-firefox.xpi "dist/qtIDM-browser-firefox-${{ steps.version.outputs.version }}.xpi"

      - name: Upload browser packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: browser-packages
          path: browser/packages/
          if-no-files-found: ignore

      - name: Upload common release metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: common-release-artifacts
          path: |
            dist/CHANGELOG-*.md
            dist/qtIDM-browser-*
          if-no-files-found: ignore

  package-deb-appimage-flatpak:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target_arch: x86_64
            runner: ubuntu-24.04
            linuxdeploy_sha: df908b19f1ed1cdafa79508d415aa12d6c56ce4d56d4149aa8c09286718706e5
            plugin_sha: cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617
          - arch: arm64
            target_arch: aarch64
            runner: ubuntu-24.04-arm
            linuxdeploy_sha: f38e4d7cebf20d8073ec4e00e0a167ac146cd8585fe2f8fe82df27d74f2bd8e1
            plugin_sha: d5b5a9020065cefda8c7af7c9500f686b23640eac50c88201a81752c6ee2e49c
    runs-on: ${{ matrix.runner }}
    env:
      LINUXDEPLOY_SHA256: df908b19f1ed1cdafa79508d415aa12d6c56ce4d56d4149aa8c09286718706e5
      LINUXDEPLOY_PLUGIN_QT_SHA256: cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617
      LINUXDEPLOY_ARM64_SHA256: f38e4d7cebf20d8073ec4e00e0a167ac146cd8585fe2f8fe82df27d74f2bd8e1
      LINUXDEPLOY_PLUGIN_QT_ARM64_SHA256: d5b5a9020065cefda8c7af7c9500f686b23640eac50c88201a81752c6ee2e49c
      DEV_CHROME_EXTENSION_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      QTIDM_CHROME_EXTENSION_ID: ${{ vars.QTIDM_CHROME_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Synchronize version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh packaging/release/sync-tag-version.sh --apply "$GITHUB_REF_NAME"

      - name: Download browser packages
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: browser-packages
          path: browser/packages

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-pip pipx qt6-base-dev qt6-base-dev-tools libcurl4-openssl-dev libsqlite3-dev pkg-config debhelper devscripts appstream desktop-file-utils flatpak flatpak-builder libfuse2 ffmpeg 7zip libsecret-tools xvfb dbus-x11
          python3 -m pip install --upgrade --break-system-packages yt-dlp || pipx install yt-dlp

      - name: Install latest Deno
        run: |
          DENO_ARCH="${{ matrix.target_arch }}-unknown-linux-gnu"
          curl -fsSL -o "$RUNNER_TEMP/deno.zip" "https://github.com/denoland/deno/releases/latest/download/deno-${DENO_ARCH}.zip"
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/deno-bin"
          sudo mv "$RUNNER_TEMP/deno-bin/deno" /usr/local/bin/deno
          sudo chmod +x /usr/local/bin/deno
          deno --version

      - name: Build Debian package
        run: |
          chmod +x packaging/build-deb.sh
          sh packaging/build-deb.sh --arch ${{ matrix.arch }}

      - name: Smoke Debian package
        run: |
          test -n "$(find dist -type f -name '*.deb' -print -quit)"
          sudo apt-get install -y ./dist/*.deb
          QT_QPA_PLATFORM=offscreen qtIDM --version
          test -x /usr/bin/qtIDM-native-host
          test -x /usr/bin/qtidm-cli
          qtidm-cli --version
          test -f /usr/lib/mozilla/native-messaging-hosts/io.qtidm.native.json
          test -f /etc/opt/chrome/native-messaging-hosts/io.qtidm.native.json
          test -f /etc/chromium/native-messaging-hosts/io.qtidm.native.json
          if [ -f browser/packages/qtidm-chrome.crx ]; then
            test -f /usr/share/qtidm/browser/packages/qtidm-chrome.crx
            test -f /usr/share/qtidm/browser/packages/qtidm-firefox.xpi
            test -f "/opt/google/chrome/extensions/${QTIDM_CHROME_EXTENSION_ID:-$DEV_CHROME_EXTENSION_ID}.json"
          fi

      - name: Install linuxdeploy
        run: |
          curl -L -o linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.target_arch }}.AppImage"
          curl -L -o linuxdeploy-plugin-qt.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.target_arch }}.AppImage"
          printf '%s  %s\n' "${{ matrix.linuxdeploy_sha }}" linuxdeploy.AppImage \
            "${{ matrix.plugin_sha }}" linuxdeploy-plugin-qt.AppImage | sha256sum --check --strict
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          sudo mv linuxdeploy.AppImage /usr/local/bin/linuxdeploy
          sudo mv linuxdeploy-plugin-qt.AppImage /usr/local/bin/linuxdeploy-plugin-qt

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
        run: |
          chmod +x packaging/build-appimage.sh packaging/appimage/AppRun
          sh packaging/build-appimage.sh --arch ${{ matrix.arch }}
          test -n "$(find dist -type f -name "qtIDM-*-${{ matrix.target_arch }}.AppImage" -print -quit)"

      - name: Smoke AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          APPIMAGE="$(find dist -type f -name "qtIDM-*-${{ matrix.target_arch }}.AppImage" -print -quit)"
          chmod +x "$APPIMAGE"
          QT_QPA_PLATFORM=offscreen "$APPIMAGE" --version
          APPIMAGE_PATH="$(realpath "$APPIMAGE")"
          # The bundled qtidm-cli is reachable by invoking the AppImage under that
          # name. The link must live outside the checkout: the Flatpak bundle is
          # built from this tree, and a dead link named after a CMake target makes
          # its linker fail with "cannot open output file qtidm-cli".
          SMOKE_DIR="$RUNNER_TEMP/qtidm-cli-smoke"
          mkdir -p "$SMOKE_DIR"
          ln -sf "$APPIMAGE_PATH" "$SMOKE_DIR/qtidm-cli"
          "$SMOKE_DIR/qtidm-cli" --version | grep -q '^qtidm-cli '
          EXTRACT_DIR="$(mktemp -d)"
          (
            cd "$EXTRACT_DIR"
            env -u APPIMAGE_EXTRACT_AND_RUN "$APPIMAGE_PATH" --appimage-extract usr/bin/deno >/dev/null
            test -x squashfs-root/usr/bin/deno
          )
          if [ -f browser/packages/qtidm-chrome.crx ]; then
            EXTRACT_DIR="$(mktemp -d)"
            (
              cd "$EXTRACT_DIR"
              env -u APPIMAGE_EXTRACT_AND_RUN "$APPIMAGE_PATH" --appimage-extract usr/share/qtidm/browser/packages >/dev/null
              test -f squashfs-root/usr/share/qtidm/browser/packages/qtidm-chrome.crx
              test -f squashfs-root/usr/share/qtidm/browser/packages/qtidm-firefox.xpi
            )
          fi

      - name: Build Flatpak bundle
        run: |
          chmod +x packaging/release/build-flatpak-bundle.sh
          sh packaging/release/build-flatpak-bundle.sh --arch ${{ matrix.arch }}

      - name: Smoke Flatpak bundle
        run: |
          FLATPAK_FILE="$(find dist -type f -name "qtIDM-*-${{ matrix.target_arch }}.flatpak" -print -quit)"
          test -n "$FLATPAK_FILE"
          flatpak install --user -y "$FLATPAK_FILE"
          dbus-run-session -- QT_QPA_PLATFORM=offscreen flatpak run io.qtidm.Qtidm --version
          flatpak run --command=qtidm-cli io.qtidm.Qtidm --version
          flatpak run --command=deno io.qtidm.Qtidm --version
          if [ -f browser/packages/qtidm-chrome.crx ]; then
            flatpak run --command=sh io.qtidm.Qtidm -c \
              'test -f /app/share/qtidm/browser/packages/qtidm-chrome.crx && test -f /app/share/qtidm/browser/packages/qtidm-firefox.xpi'
          fi

      - name: Upload Debian, AppImage and Flatpak packages
        uses: actions/upload-artifact@v6
        with:
          name: qtidm-packages-ubuntu-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.ddeb
            dist/*.changes
            dist/*.buildinfo
            dist/*-${{ matrix.target_arch }}.AppImage
            dist/*-${{ matrix.target_arch }}.flatpak

  package-rpm:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            target_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:40
    steps:
      - uses: actions/checkout@v6

      - name: Synchronize version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh packaging/release/sync-tag-version.sh --apply "$GITHUB_REF_NAME"

      - name: Install Fedora packaging dependencies
        run: |
          dnf install -y rpm-build cmake ninja-build gcc-c++ qt6-qtbase-devel libcurl-devel sqlite-devel tar git

      - name: Build RPM package
        run: |
          chmod +x packaging/build-rpm.sh
          sh packaging/build-rpm.sh --arch ${{ matrix.arch }}

      - name: Smoke RPM package
        run: |
          RPM_FILE="$(find dist -type f -name "qtidm-*-1.fc40.${{ matrix.target_arch }}.rpm" -print -quit)"
          test -n "$RPM_FILE"
          dnf install -y "$RPM_FILE"
          QT_QPA_PLATFORM=offscreen qtIDM --version
          test -x /usr/bin/qtIDM-native-host
          test -x /usr/bin/qtidm-cli
          qtidm-cli --version
          test -f /usr/lib/mozilla/native-messaging-hosts/io.qtidm.native.json
          test -f /etc/opt/chrome/native-messaging-hosts/io.qtidm.native.json
          test -f /etc/chromium/native-messaging-hosts/io.qtidm.native.json

      - name: Upload RPM package
        uses: actions/upload-artifact@v6
        with:
          name: qtidm-packages-rpm-${{ matrix.arch }}
          path: dist/*.rpm

  package-arch:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target_arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:latest
          - arch: arm64
            target_arch: aarch64
            runner: ubuntu-24.04-arm
            image: ogarcia/archlinux:latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Synchronize version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh packaging/release/sync-tag-version.sh --apply "$GITHUB_REF_NAME"

      - name: Install Arch packaging dependencies
        run: |
          sed -i 's/^[#[:space:]]*LocalFileSigLevel.*/LocalFileSigLevel = Optional/' /etc/pacman.conf
          grep -q '^LocalFileSigLevel' /etc/pacman.conf || sed -i '/^\[options\]/a LocalFileSigLevel = Optional' /etc/pacman.conf
          pacman -Syu --noconfirm base-devel cmake ninja gcc qt6-base curl sqlite hicolor-icon-theme tar git

      - name: Build Arch package
        run: |
          useradd -m builduser
          chown -R builduser:builduser .
          chmod +x packaging/build-arch.sh
          su builduser -c "sh packaging/build-arch.sh --arch ${{ matrix.arch }}"

      - name: Smoke Arch package
        run: |
          sed -i 's/^[#[:space:]]*LocalFileSigLevel.*/LocalFileSigLevel = Optional/' /etc/pacman.conf
          grep -q '^LocalFileSigLevel' /etc/pacman.conf || sed -i '/^\[options\]/a LocalFileSigLevel = Optional' /etc/pacman.conf
          ARCH_FILE="$(find dist -type f -name "qtidm-*-${{ matrix.target_arch }}.pkg.tar.*" ! -name "*-debug-*" -print -quit)"
          test -n "$ARCH_FILE"
          pacman -U --noconfirm "$ARCH_FILE"
          QT_QPA_PLATFORM=offscreen qtIDM --version
          test -x /usr/bin/qtIDM-native-host
          test -x /usr/bin/qtidm-cli
          qtidm-cli --version
          test -f /usr/lib/mozilla/native-messaging-hosts/io.qtidm.native.json
          test -f /etc/opt/chrome/native-messaging-hosts/io.qtidm.native.json
          test -f /etc/chromium/native-messaging-hosts/io.qtidm.native.json

      - name: Upload Arch package
        uses: actions/upload-artifact@v6
        with:
          name: qtidm-packages-arch-${{ matrix.arch }}
          path: dist/*.pkg.tar.*

  publish-release:
    needs: [build-test, package-deb-appimage-flatpak, package-rpm, package-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download all package artifacts
        uses: actions/download-artifact@v6
        with:
          path: downloaded-artifacts

      - name: Consolidate release artifacts
        run: |
          mkdir -p dist
          find downloaded-artifacts -type f -exec cp -f {} dist/ \;
          rm -rf downloaded-artifacts
          echo "Release artifacts:"
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: qtIDM ${{ needs.build-test.outputs.version }}
          body_path: dist/CHANGELOG-${{ needs.build-test.outputs.version }}.md
          files: dist/*
