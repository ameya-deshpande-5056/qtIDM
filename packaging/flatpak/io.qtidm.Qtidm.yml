app-id: io.qtidm.Qtidm
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: qtIDM
finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-download:create
  - --own-name=io.qtidm.Qtidm
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.NetworkManager
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
      - -Dtpm2=false
      - -Dpam=false
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/bash-completion
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.8.tar.xz
        sha256: 70e7279ccc7e8cce1bb0e1c57a3785e2c79aea6d1dd9a538abda3886f11cdf72

  - name: sevenzip
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 7zz /app/bin/7zz
      - ln -s 7zz /app/bin/7z
      - install -Dm644 License.txt /app/share/licenses/7zip/License.txt
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz
        sha256: 22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e
        strip-components: 0

  - name: yt-dlp
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm644 LICENSE /app/share/licenses/yt-dlp/LICENSE
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux
        sha256: 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
        dest-filename: yt-dlp
      - type: file
        url: https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/LICENSE
        sha256: 7e12e5df4bae12cb21581ba157ced20e1986a0508dd10d0e8a4ab9a4cf94e85c
        dest-filename: LICENSE

  - name: qtIDM
    buildsystem: cmake-ninja
    config-opts:
      - -DQTIDM_BUILD_TESTS=OFF
      - -DQTIDM_INSTALL_NATIVE_MESSAGING_HOSTS=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - build
          - build-*
          - cmake-build-*
          - dist
          - qtidm-chrome.pem
          - '*.AppImage'
          - '*.buildinfo'
          - '*.changes'
          - '*.deb'
          - '*.ddeb'
          - '*.flatpak'
