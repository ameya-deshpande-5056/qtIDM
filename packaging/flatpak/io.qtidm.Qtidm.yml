app-id: io.qtidm.Qtidm
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: qtIDM
finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-download:create
  - --own-name=io.qtidm.Qtidm
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.NetworkManager
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
      - -Dtpm2=false
      - -Dpam=false
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/bash-completion
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.8.tar.xz
        sha256: 70e7279ccc7e8cce1bb0e1c57a3785e2c79aea6d1dd9a538abda3886f11cdf72

  - name: sevenzip
    buildsystem: simple
    only-arches:
      - x86_64
      - aarch64
    build-commands:
      - install -Dm755 7zz /app/bin/7zz
      - ln -s 7zz /app/bin/7z
      - install -Dm644 License.txt /app/share/licenses/7zip/License.txt
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-x64.tar.xz
        sha256: 2b539cf067b2ad48e1baa5093dbaa8818b73542d1222a0ffde9dc5f2922ea62e
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-arm64.tar.xz
        sha256: edcc408aacce77da5223728f2eceb5e9f6dc713b8a9df934ad21e2a7f7560627
        strip-components: 0

  - name: yt-dlp
    buildsystem: simple
    only-arches:
      - x86_64
      - aarch64
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm644 LICENSE /app/share/licenses/yt-dlp/LICENSE
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux
        sha256: 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
        dest-filename: yt-dlp
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux_aarch64
        sha256: e87e9533e89fe5889abaa21f5114dfe7756d6aa6219b83551add04d48b18e483
        dest-filename: yt-dlp
      - type: file
        url: https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/LICENSE
        sha256: 7e12e5df4bae12cb21581ba157ced20e1986a0508dd10d0e8a4ab9a4cf94e85c
        dest-filename: LICENSE

  - name: deno
    buildsystem: simple
    only-arches:
      - x86_64
      - aarch64
    build-commands:
      - install -Dm755 deno /app/bin/deno
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
        sha256: e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/denoland/deno/releases/download/v2.9.8/deno-aarch64-unknown-linux-gnu.zip
        sha256: d49596c20b9788cf8f5d8ddf644103d4bde56ed239753f0bdb92ba9361d51905

  - name: qtIDM
    buildsystem: cmake-ninja
    config-opts:
      - -DQTIDM_BUILD_TESTS=OFF
      - -DQTIDM_INSTALL_NATIVE_MESSAGING_HOSTS=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - build
          - build-*
          - cmake-build-*
          - dist
          - qtidm-chrome.pem
          - '*.AppImage'
          - '*.buildinfo'
          - '*.changes'
          - '*.deb'
          - '*.ddeb'
          - '*.flatpak'
